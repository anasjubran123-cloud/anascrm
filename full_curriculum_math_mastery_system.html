<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إتقان الرياضيات — الصف الثاني المتوسط — الفصل الدراسي الأول</title>
<style>
/* ============================================================
   نظام إتقان الرياضيات الشامل — تصميم عربي RTL
   ============================================================ */
:root{
  --primary:#1a5fb4; --primary-dark:#0d3d78; --primary-light:#e8f1fb;
  --accent:#26a269; --accent-light:#e6f6ee;
  --warn:#e5a50a; --warn-light:#fdf3d7;
  --danger:#c01c28; --danger-light:#fbe5e7;
  --purple:#613583; --purple-light:#f0e7f7;
  --bg:#f4f6fa; --card:#ffffff; --text:#1c2733; --muted:#5a6b7d;
  --border:#dde4ec; --radius:14px;
  --shadow:0 2px 10px rgba(20,40,70,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{
  font-family:"Segoe UI","Tahoma","Arial",sans-serif;
  background:var(--bg); color:var(--text);
  direction:rtl; text-align:right; line-height:1.75;
  min-height:100vh;
}
#app{max-width:1000px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.55rem} h2{font-size:1.3rem} h3{font-size:1.12rem}
h1,h2,h3{color:var(--primary-dark);line-height:1.5}
p{margin:.4em 0}
.screen{display:none;animation:fadein .35s ease}
.screen.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* بطاقات */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin:14px 0}
.card.tight{padding:14px}
.card-title{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;border-radius:var(--radius);padding:26px 22px;margin:10px 0 18px}
.hero h1,.hero h2{color:#fff}
.hero p{color:#dce9f9}

/* أزرار */
.btn{display:inline-block;border:none;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:1rem;font-weight:700;padding:12px 22px;margin:4px 2px;
  background:var(--primary);color:#fff;transition:transform .12s,box-shadow .12s,opacity .12s;
  min-height:48px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,95,180,.3)}
.btn:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.green{background:var(--accent)} .btn.red{background:var(--danger)}
.btn.gray{background:#6b7a8c} .btn.purple{background:var(--purple)}
.btn.outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn.small{padding:7px 14px;font-size:.9rem;min-height:38px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* شارات الإتقان والحالات */
.badge{display:inline-block;border-radius:999px;padding:3px 13px;font-size:.85rem;font-weight:700;white-space:nowrap}
.badge.b-green{background:var(--accent-light);color:#176b46;border:1px solid #9adbbd}
.badge.b-blue{background:var(--primary-light);color:var(--primary-dark);border:1px solid #b3cdee}
.badge.b-warn{background:var(--warn-light);color:#7a5705;border:1px solid #ecd28a}
.badge.b-red{background:var(--danger-light);color:#8c1521;border:1px solid #f0aab1}
.badge.b-purple{background:var(--purple-light);color:var(--purple);border:1px solid #cfb6e3}
.badge.b-gray{background:#eef1f5;color:#54616f;border:1px solid #ccd5df}

/* شريط التقدم */
.progress-wrap{background:#e4e9f0;border-radius:999px;height:14px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),#52c98e);
  border-radius:999px;transition:width .4s;min-width:6px}
.progress-bar.warn{background:linear-gradient(90deg,var(--warn),#f0c14b)}
.progress-bar.danger{background:linear-gradient(90deg,var(--danger),#e06570)}

/* المؤقّتات */
.timer-bar{position:sticky;top:0;z-index:50;background:var(--card);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;align-items:center;
  justify-content:space-between;gap:8px;padding:9px 16px;margin:6px 0 12px}
.timer-num{font-size:1.25rem;font-weight:800;color:var(--primary-dark);direction:ltr;display:inline-block}
.timer-num.t-warn{color:var(--warn)} .timer-num.t-danger{color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.qtimer{font-size:.95rem;color:var(--muted)}

/* بطاقة السؤال */
.q-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.q-text{font-size:1.15rem;font-weight:700;margin:10px 0 16px;line-height:2}
.q-figure{background:var(--primary-light);border:1px dashed var(--primary);border-radius:10px;
  padding:12px 16px;margin:10px 0;font-size:1.05rem;white-space:pre-line}
table.q-table{border-collapse:collapse;margin:10px auto;background:#fff}
table.q-table th,table.q-table td{border:1px solid var(--primary);padding:7px 18px;text-align:center}
table.q-table th{background:var(--primary-light)}
.opt{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--border);
  border-radius:11px;padding:13px 16px;margin:8px 0;font-family:inherit;font-size:1.05rem;cursor:pointer;
  transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--primary);background:var(--primary-light)}
.opt:focus-visible{outline:3px solid var(--warn)}
.opt.sel{border-color:var(--primary);background:var(--primary-light);font-weight:700}
.opt.ok{border-color:var(--accent);background:var(--accent-light)}
.opt.bad{border-color:var(--danger);background:var(--danger-light)}
input[type=text],input[type=password],input[type=number],textarea{
  width:100%;border:2px solid var(--border);border-radius:10px;padding:12px 14px;
  font-family:inherit;font-size:1.05rem;background:#fff;color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{min-height:90px;resize:vertical}
.steps-grid label{display:block;font-weight:700;margin:10px 0 4px;color:var(--primary-dark)}

/* التغذية الراجعة */
.feedback{border-radius:12px;padding:16px 18px;margin:14px 0;border:2px solid}
.feedback.good{background:var(--accent-light);border-color:var(--accent)}
.feedback.bad{background:var(--danger-light);border-color:var(--danger)}
.feedback.neutral{background:var(--warn-light);border-color:var(--warn)}
.feedback h3{margin-bottom:6px}
.solved-example{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;white-space:pre-line}
.diag{font-weight:700;color:var(--danger)}

/* الثقة */
.conf-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.conf-row .opt{flex:1;min-width:130px;text-align:center;margin:0}

/* قائمة الفصول */
.chapter-card{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.chapter-card .info{flex:1;min-width:230px}
.locked{opacity:.6}
.lock-ico{font-size:1.4rem}

/* جداول التقارير */
table.report{width:100%;border-collapse:collapse;margin:10px 0;background:#fff}
table.report th,table.report td{border:1px solid var(--border);padding:9px 12px;text-align:right;vertical-align:top}
table.report th{background:var(--primary-light);color:var(--primary-dark)}
table.report tr:nth-child(even){background:#f7f9fc}
.report-pre{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;
  white-space:pre-wrap;font-family:inherit;max-height:420px;overflow:auto}

/* تنبيهات */
.alert{border-radius:10px;padding:12px 16px;margin:10px 0;border-right:6px solid}
.alert.info{background:var(--primary-light);border-color:var(--primary)}
.alert.ok{background:var(--accent-light);border-color:var(--accent)}
.alert.warn{background:var(--warn-light);border-color:var(--warn)}
.alert.err{background:var(--danger-light);border-color:var(--danger)}

/* الإشعارات العائمة */
#toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:#222e3a;color:#fff;
  border-radius:10px;padding:12px 22px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:200;display:none;
  font-size:1rem;max-width:90vw;text-align:center}

/* لوحة ولي الأمر */
.pin-box{max-width:380px;margin:30px auto;text-align:center}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--border);padding:6px 2px}
.kv b{color:var(--primary-dark)}

/* عناصر مساعدة */
.muted{color:var(--muted);font-size:.92rem}
.center{text-align:center}
.flex{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
ul.clean{margin:6px 22px 6px 0}
a{color:var(--primary)}
.num{direction:ltr;unicode-bidi:embed;display:inline-block}

/* الطباعة */
@media print{
  body{background:#fff}
  #app{max-width:100%;padding:0}
  .no-print,.btn,.timer-bar,#toast{display:none !important}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  .report-pre{max-height:none;overflow:visible}
}
/* الجوال */
@media (max-width:640px){
  html{font-size:16px}
  #app{padding:10px 8px 70px}
  .btn{width:100%;margin:4px 0}
  .btn.small{width:auto}
  .hero{padding:20px 16px}
  .conf-row .opt{min-width:46%}
}
</style>

<script>
"use strict";
/* ============================================================================
   نظام إتقان الرياضيات الشامل — الصف الثاني المتوسط — الفصل الدراسي الأول
   (المنهج السعودي — كتاب الرياضيات GE-ME-K08-SM1)
   ملف واحد يعمل محليًا بدون خادم. جميع الأسئلة والشروح مكتوبة مسبقًا،
   والسلوك "الذكي" مبني على قواعد JavaScript + خريطة اعتماد المفاهيم.
   ملاحظة: أرقام الصفحات في النسخة الممسوحة ضوئيًا تعذّر استخراجها آليًا،
   لذلك تُشار المراجع برقم الدرس، وتحمل وسم «يحتاج مراجعة يدوية».
   ============================================================================ */

/* ----------------------------------------------------------------------------
   الإعدادات العامة
   ----------------------------------------------------------------------------
   إعداد إرسال البريد التلقائي (EmailJS):
   1) أنشئ حسابًا مجانيًا في https://www.emailjs.com
   2) أنشئ Service و Template (يستقبل المتغيرات: to_email, subject, message)
   3) ضع القيم الثلاث أدناه مكان العبارات النائبة.
   - لا تضع هنا أي كلمة مرور SMTP أو مفتاح سري خلفي؛ المفتاح العام فقط.
   - إذا بقيت القيم كما هي (تبدأ بـ "ضع_")، يعمل النظام تلقائيًا بوضع
     mailto الاحتياطي: يفتح برنامج البريد برسالة جاهزة للإرسال.
---------------------------------------------------------------------------- */
const CONFIG = {
  EMAILJS_PUBLIC_KEY : "ضع_المفتاح_العام_هنا",      // EmailJS Public Key
  EMAILJS_SERVICE_ID : "ضع_معرف_الخدمة_هنا",        // EmailJS Service ID
  EMAILJS_TEMPLATE_ID: "ضع_معرف_القالب_هنا",        // EmailJS Template ID
  REPORT_RECIPIENT   : "a_jubran2010@hotmail.com",   // مستلم التقارير
  PARENT_PIN         : "1234",                       // رقم لوحة ولي الأمر (غيّره هنا)
  PASS_PERCENT       : 90,   // نسبة اجتياز الفصل
  REVIEW_PERCENT     : 80,   // أقل من 90 وأعلى من/يساوي 80 = يحتاج مراجعة
  STORAGE_KEY        : "mathMasteryK08SM1_v1",
  FAST_RATIO         : 0.25, // إجابة أسرع من ربع الوقت المقدر = سريعة جدًا
  TEACHBACK_MIN_LEN  : 15,   // أقل طول مقبول لإجابة "اشرح بكلماتك"
  STEPS_MIN_LEN      : 6     // أقل طول مقبول لكل خطوة في "أظهر خطواتك"
};

/* أسماء حالات الإتقان */
const MASTERY = {
  VERY:"متقن جدًا", OK:"متقن", REVIEW:"جيد لكن يحتاج مراجعة", WEAK:"نقطة ضعف",
  FAIL:"غير متقن", RETEACH:"يحتاج شرح من البداية", PARTIAL:"فهم غير مكتمل",
  VERIFY:"يحتاج تحقق إضافي", FIX:"يحتاج تثبيت", SHORT:"غير متقن على المدى القصير",
  NONE:"لم يُختبر بعد"
};

/* ============================================================================
   دوال معالجة الإجابات (تطبيع الأرقام العربية، الكسور، النسب المئوية)
   ============================================================================ */
function normalizeArabicNumbers(s){
  if(s===null||s===undefined) return "";
  s=String(s);
  const ar="٠١٢٣٤٥٦٧٨٩", fa="۰۱۲۳۴۵۶۷۸۹";
  let out="";
  for(const ch of s){
    const i=ar.indexOf(ch), j=fa.indexOf(ch);
    if(i>=0) out+=String(i);
    else if(j>=0) out+=String(j);
    else if(ch==="٫") out+=".";
    else if(ch==="٬") out+="";
    else if(ch==="٪") out+="%";
    else if(ch==="−") out+="-";
    else out+=ch;
  }
  return out;
}
function normalizeAnswer(s){
  s=normalizeArabicNumbers(s).trim().toLowerCase();
  s=s.replace(/\s+/g," ")
     .replace(/[()]/g,"")
     .replace(/،/g,",")
     .replace(/‏|‎/g,"")
     .replace(/\\/g,"/")
     .replace(/\s*\/\s*/g,"/")
     .replace(/\s*:\s*/g,":")
     .replace(/\s*=\s*/g,"=")
     .replace(/ريال|سم|كجم|كم|متر|م2|م²|درجة|لتر|دقيقة|ساعة|قطعة|كوب|أكواب/g,"")
     .trim();
  return s;
}
/* يحاول قراءة قيمة عددية من نص: عدد عشري، كسر أ/ب، عدد كسري "ع أ/ب"، نسبة % */
function parseNumeric(s){
  s=normalizeAnswer(s);
  if(s==="") return null;
  s=s.replace(/^\+/,"");
  let pct=false;
  if(s.endsWith("%")){pct=true;s=s.slice(0,-1).trim();}
  // عدد كسري مثل "2 1/3" أو "-2 1/3"
  let m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/);
  if(m){const sign=m[1]==="-"?-1:1;const d=Number(m[4]);if(d===0)return null;
    let v=sign*(Number(m[2])+Number(m[3])/d);return pct?v/100:v;}
  // كسر مثل "3/4" أو "-3/4"
  m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){const d=Number(m[2]);if(d===0)return null;let v=Number(m[1])/d;return pct?v/100:v;}
  // عدد عادي
  if(/^-?\d+(?:\.\d+)?$/.test(s)){let v=Number(s);return pct?v/100:v;}
  return null;
}
function isEquivalentFractionOrDecimal(a,b){
  const x=parseNumeric(a), y=parseNumeric(b);
  if(x===null||y===null) return false;
  return Math.abs(x-y)<0.005;
}
function comparePercentDecimal(a,b){
  // يقبل 25% مقابل 0.25 ومقابل 1/4
  const x=parseNumeric(a), y=parseNumeric(b);
  if(x===null||y===null) return false;
  if(Math.abs(x-y)<0.005) return true;
  return Math.abs(x/100-y)<0.005||Math.abs(x-y/100)<0.005;
}
/* المقارنة الرئيسة: نص المستخدم مقابل الإجابة الصحيحة + قائمة الإجابات المقبولة */
function compareAnswers(user,correct,accepted,allowPercent){
  const u=normalizeAnswer(user);
  if(u==="") return false;
  const all=[correct].concat(accepted||[]);
  for(const c of all){
    const cn=normalizeAnswer(c);
    if(u===cn) return true;
    if(isEquivalentFractionOrDecimal(u,cn)) return true;
    if(allowPercent&&comparePercentDecimal(u,cn)) return true;
  }
  return false;
}
function checkRequiredSteps(fields){
  // fields: {given, law, substitution, work, final}
  const missing=[];
  const names={given:"المعطيات",law:"القانون المستخدم",substitution:"التعويض",work:"خطوات الحل",final:"الإجابة النهائية"};
  for(const k in names){
    const v=(fields[k]||"").trim();
    if(v.length<CONFIG.STEPS_MIN_LEN&&k!=="final") missing.push(names[k]);
    if(k==="final"&&v.length===0) missing.push(names[k]);
  }
  return {ok:missing.length===0, missing};
}
function checkTeachBackKeywords(text,keywords){
  const t=normalizeArabicNumbers(text||"").trim();
  const found=[],missing=[];
  (keywords||[]).forEach(group=>{
    // كل عنصر قد يكون "كلمة|مرادف|مرادف"
    const alts=group.split("|");
    if(alts.some(a=>t.includes(a))) found.push(alts[0]); else missing.push(alts[0]);
  });
  const longEnough=t.length>=CONFIG.TEACHBACK_MIN_LEN;
  const autoOk=longEnough&&found.length>=Math.min(2,(keywords||[]).length);
  return {autoOk,longEnough,found,missing};
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function fmtTime(sec){
  sec=Math.max(0,Math.round(sec));
  const m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function esc(s){return String(s===undefined||s===null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ytLink(topic){return "https://www.youtube.com/results?search_query="+encodeURIComponent("شرح "+topic+" للصف الثاني المتوسط");}

/* ============================================================================
   خريطة المنهج — كتاب الرياضيات، الصف الثاني المتوسط، الفصل الدراسي الأول
   (المنهج السعودي). المرجع: رقم الفصل والدرس في الكتاب.
   أرقام الصفحات: يحتاج مراجعة يدوية (النسخة المرفقة ممسوحة ضوئيًا).
   ============================================================================ */
const PAGE_NOTE="المرجع: رقم الدرس في الكتاب — أرقام الصفحات تحتاج مراجعة يدوية";

const CURRICULUM={
  title:"الرياضيات — الصف الثاني المتوسط — الفصل الدراسي الأول",
  chapters:[
  {
    id:"ch1", num:1, title:"الأعداد النسبية",
    minutes:90, passPercent:CONFIG.PASS_PERCENT,
    overview:"يتناول هذا الفصل مفهوم العدد النسبي وكتابته كسرًا أو عددًا عشريًا، ومقارنة الأعداد النسبية وترتيبها، والعمليات الأربع عليها (الضرب، القسمة، الجمع، الطرح) مع التركيز على الإشارات والكسور والأعداد الكسرية.",
    prereqIds:["p1-1","p1-2","p1-3","p1-4"],
    prereqNote:"يتطلب هذا الفصل إتقان: العمليات على الأعداد الصحيحة، تبسيط الكسور، ترتيب العمليات، والتحويل بين الكسر والعدد العشري.",
    lessons:[
      {id:"l1-1",num:"1-1",title:"الأعداد النسبية",concepts:["c1-1"]},
      {id:"l1-2",num:"1-2",title:"مقارنة الأعداد النسبية وترتيبها",concepts:["c1-2"]},
      {id:"l1-3",num:"1-3",title:"ضرب الأعداد النسبية",concepts:["c1-3"]},

function defaultState(){
  const st={studentName:"",createdAt:new Date().toISOString(),lastStudyTime:null,
    perChapter:{},questions:{},reports:[],events:{tabSwitches:0,pastes:0},
    midTestDone:false,midTestScore:null,finalDone:false,finalScore:null,finalPassed:false};
  CURRICULUM.chapters.forEach(ch=>{
    st.perChapter[ch.id]={prereqDone:false,prereqScore:null,prereqWeak:[],
      delayedDone:false,delayedScore:null,
      conceptsDone:{},testDone:false,testScore:null,testFirstScore:null,
      timeUsedSec:0,timerExpired:false,status:"locked",blockers:[],
      recoveryDone:false,warn75:false,warn90:false,reportCount:0};
  });
  st.perChapter[CURRICULUM.chapters[0].id].status="unlocked";
  return st;
}
let state=null;
function loadProgress(){
  try{
    const raw=localStorage.getItem(CONFIG.STORAGE_KEY);
    if(raw){const parsed=JSON.parse(raw);state=Object.assign(defaultState(),parsed);
      // دمج عميق بسيط للفصول والأحداث
      const d=defaultState();
      state.perChapter=Object.assign(d.perChapter,parsed.perChapter||{});
      state.events=Object.assign(d.events,parsed.events||{});
      return true;}
  }catch(e){console.warn("تعذرت قراءة التقدم المحفوظ",e);}
  state=defaultState();
  return false;
}
function saveProgress(){
  try{state.lastStudyTime=new Date().toISOString();
    localStorage.setItem(CONFIG.STORAGE_KEY,JSON.stringify(state));}
  catch(e){console.warn("تعذر الحفظ",e);}
}
function qRec(qid){
  if(!state.questions[qid]) state.questions[qid]={attempts:0,wrongCount:0,correct:null,
    firstTryCorrect:null,timeSpent:0,fast:false,confidence:null,answerChanges:0,
    answers:[],steps:null,stepsOk:null,teachText:null,teachOk:null,delayedWrong:false};

}

function masteryBadgeClass(m){

/* ============================================================================
   حساب الإتقان لكل مفهوم (قواعد ثابتة وفق منهجية النظام)
   ============================================================================ */
function conceptQuestions(cid){return QUESTION_BANK.filter(q=>q.conceptId===cid);}
function updateMastery(cid){return computeMastery(cid);} // اسم بديل مطلوب في الواجهة
function computeMastery(cid){
  const qs=conceptQuestions(cid);
  let attempted=0,firstWrong=0,anyTriple=false,anyDouble=false,partial=false,
      verify=false,fix=false,guess=false,delayedFail=false,teachOk=null,allFirst=true;
  qs.forEach(q=>{
    const r=state.questions[q.id];
    if(!r||r.attempts===0){if(q.tags.indexOf("lesson")>=0||q.tags.indexOf("test")>=0)allFirst=false;return;}
    attempted++;
    if(q.questionType==="teachback"){teachOk=r.teachOk;return;}
    if(r.firstTryCorrect===false){firstWrong++;allFirst=false;}
    if(r.wrongCount>=3) anyTriple=true;
    if(r.wrongCount===2) anyDouble=true;
    if(q.questionType==="steps"&&r.correct&&r.stepsOk===false) partial=true;
    if(r.correct&&r.fast&&q.difficulty>=3) verify=true;
    if(r.correct&&r.confidence==="كنت أخمن") guess=true;
    if(r.correct&&r.confidence==="غير متأكد") fix=true;
    if(q.tags.indexOf("delayed")>=0&&r.delayedWrong) delayedFail=true;
  });
  if(attempted===0) return MASTERY.NONE;
  if(anyTriple) return MASTERY.RETEACH;
  if(firstWrong>=2||anyDouble) return MASTERY.WEAK;
  if(delayedFail) return MASTERY.SHORT;
  if(partial) return MASTERY.PARTIAL;
  if(verify||guess) return MASTERY.VERIFY;
  if(fix) return MASTERY.FIX;
  if(firstWrong===1) return MASTERY.REVIEW;
  if(allFirst&&teachOk===true) return MASTERY.VERY;
  return MASTERY.OK;
}
function chapterConcepts(ch){const out=[];ch.lessons.forEach(l=>l.concepts.forEach(c=>out.push(c)));return out;}
function chapterBlockers(ch){
  const blockers=[];
  chapterConcepts(ch).forEach(cid=>{
    const m=computeMastery(cid);
    if(CONCEPTS[cid].critical&&[MASTERY.WEAK,MASTERY.FAIL,MASTERY.RETEACH,MASTERY.NONE,MASTERY.SHORT].indexOf(m)>=0)
      blockers.push("مفهوم حرج غير متقن: "+CONCEPTS[cid].title+" ("+m+")");
    if(CONCEPTS[cid].critical&&m===MASTERY.PARTIAL)
      blockers.push("إجابات صحيحة بدون خطوات كافية في مفهوم حرج: "+CONCEPTS[cid].title);
  });
  // أخطاء متكررة من النوع نفسه
  const mistakeCounts={};
  QUESTION_BANK.filter(q=>q.chapterId===ch.id).forEach(q=>{
    const r=state.questions[q.id];
    if(r&&r.wrongCount>0) mistakeCounts[q.mistakeType]=(mistakeCounts[q.mistakeType]||0)+r.wrongCount;
  });
  for(const mt in mistakeCounts) if(mistakeCounts[mt]>=4)
    blockers.push("خطأ متكرر ("+mistakeCounts[mt]+" مرات): "+mt);
  // إجابات سريعة على أسئلة صعبة
  const fastHard=QUESTION_BANK.filter(q=>q.chapterId===ch.id&&q.difficulty>=3)
    .filter(q=>{const r=state.questions[q.id];return r&&r.correct&&r.fast;}).length;
  if(fastHard>=2) blockers.push("إجابات صحيحة بسرعة عالية جدًا على "+fastHard+" من الأسئلة الصعبة — قد تحتاج إلى إعادة هذا الجزء للتأكد من الفهم");
  return blockers;
}

/* ============================================================================
   اختيار الأسئلة (عشوائي مع الحفاظ على صحة الشروح والمراجع)
   ============================================================================ */
function pickQuestions(filterFn,limit){
  let qs=shuffle(QUESTION_BANK.filter(filterFn));
  if(limit&&qs.length>limit) qs=qs.slice(0,limit);
  return qs.map(q=>q.id);
}
function lessonRunIds(cid){
  // مسار الدرس: الأساسية والمتوسطة + اكتشف الخطأ + اشرح بكلماتك (بترتيب عشوائي مع بقاء الشرح آخرًا)
  const base=shuffle(conceptQuestions(cid).filter(q=>q.tags.indexOf("lesson")>=0&&q.questionType!=="teachback").map(q=>q.id));
  const teach=conceptQuestions(cid).filter(q=>q.questionType==="teachback").map(q=>q.id);
  return base.concat(teach);
}
function chapterTestIds(chId){
  const test=shuffle(QUESTION_BANK.filter(q=>q.chapterId===chId&&q.tags.indexOf("test")>=0).map(q=>q.id));
  return test;
}
function delayedIds(beforeChapterNum){
  return pickQuestions(q=>{
    const ch=CURRICULUM.chapters.find(c=>c.id===q.chapterId);
    return ch&&ch.num<beforeChapterNum&&q.tags.indexOf("delayed")>=0;
  },beforeChapterNum===2?4:6);
}
function recoveryIds(chId){
  const ch=CURRICULUM.chapters.find(c=>c.id===chId);
  const weak=chapterConcepts(ch).filter(cid=>{
    const m=computeMastery(cid);
    return [MASTERY.OK,MASTERY.VERY].indexOf(m)<0;
  });
  let ids=[];
  weak.forEach(cid=>{
    ids=ids.concat(conceptQuestions(cid)
      .filter(q=>q.questionType!=="teachback")
      .map(q=>q.id));
  });
  return shuffle(ids).slice(0,Math.max(6,Math.min(12,ids.length)));
}

let chapterTimerInterval=null,activeChapterId=null;
function startChapterTimer(chId){
  activeChapterId=chId;
  stopChapterTimer();
  chapterTimerInterval=setInterval(()=>{
    if(document.hidden) return; // لا نحسب الوقت والتبويب مخفي
    const pc=state.perChapter[chId];
    pc.timeUsedSec++;
    const ch=CURRICULUM.chapters.find(c=>c.id===chId);
    const budget=ch.minutes*60,left=budget-pc.timeUsedSec;
    updateTimerBar(chId,left,budget);
    if(!pc.warn75&&pc.timeUsedSec>=budget*0.75){pc.warn75=true;toast("تنبيه: استُهلك 75% من وقت الفصل المقترح.");}
    if(!pc.warn90&&pc.timeUsedSec>=budget*0.90){pc.warn90=true;toast("تنبيه مهم: استُهلك 90% من وقت الفصل!");}
    if(left<=0&&!pc.timerExpired){pc.timerExpired=true;onChapterTimeExpired(chId);}
    if(pc.timeUsedSec%20===0) saveProgress();
  },1000);
}
function stopChapterTimer(){if(chapterTimerInterval){clearInterval(chapterTimerInterval);chapterTimerInterval=null;}}
function updateTimerBar(chId,left,budget){
  const el=$("chapter-timer-num");
  if(!el) return;
  el.textContent=fmtTime(Math.max(0,left));
  el.className="timer-num"+(left<=budget*0.1?" t-danger":(left<=budget*0.25?" t-warn":""));
}
function onChapterTimeExpired(chId){
  saveProgress();
  toast("انتهى وقت الفصل المقترح. سيُحفظ ما أُنجز ويُولَّد تقرير جزئي.");
  if(RUN&&RUN.chapterId===chId&&RUN.mode!=="final"){
    finishRun(true); // إنهاء جزئي
  }else{
    generateChapterReport(chId,true);
  }
}

/* ============================================================================
   فحص الإجابة، تشخيص الخطأ، التغذية الراجعة
   ============================================================================ */
function checkAnswer(q,userInput){
  if(q.exactMatch){
    const u=normalizeAnswer(userInput);
    return [q.correctAnswer].concat(q.acceptedAnswers).some(c=>normalizeAnswer(c)===u);
  }
  return compareAnswers(userInput,q.correctAnswer,q.acceptedAnswers,q.allowPercent);
}
function diagnoseMistake(q,userInput){
  // تشخيص قائم على قواعد: نستعمل نوع الخطأ المعرف للسؤال + فحوص عامة
  const diags=[q.mistakeType];
  const num=parseNumeric(userInput),correctNum=parseNumeric(q.correctAnswer);
  if(num!==null&&correctNum!==null){
    if(Math.abs(num+correctNum)<0.005&&correctNum!==0) diags.push("خطأ في الإشارة السالبة أو الموجبة (الناتج معكوس الإشارة)");
    if(Math.abs(num-correctNum*10)<0.01||Math.abs(num*10-correctNum)<0.01) diags.push("خطأ في الأعداد العشرية (موضع الفاصلة)");
  }
  return diags;
}
function showExplanation(q,correct,userInput,extraNote){
  const fb=$("feedback-area");
  const diags=correct?[]:diagnoseMistake(q,userInput);
  let html='<div class="feedback '+(correct?"good":"bad")+'">';
  html+='<h3>'+(correct?"✅ إجابة صحيحة":"❌ إجابة غير صحيحة")+'</h3>';
  if(!correct){
    html+='<p class="diag">التشخيص المحتمل: '+esc(diags.join("؛ "))+'</p>';
    if(q.wrongAnswerFeedback) html+='<p><b>ما الذي حدث على الأرجح:</b> '+esc(q.wrongAnswerFeedback)+'</p>';
    html+='<p><b>الإجابة الصحيحة:</b> '+esc(q.correctAnswer)+'</p>';
  }
  if(extraNote) html+='<p><b>ملاحظة:</b> '+esc(extraNote)+'</p>';
  html+='<p><b>الشرح:</b> '+esc(q.explanation)+'</p>';
  if(q.solvedExample) html+='<div class="solved-example"><b>مثال محلول مشابه:</b>\n'+esc(q.solvedExample)+'</div>';
  const cn=CONCEPTS[q.conceptId];
  if(!correct&&cn) html+='<p class="muted">إن تكرر الخطأ هنا فراجع أولًا: '+esc(cn.reviewFirst.join("، "))
    +' — <a href="'+ytLink(cn.title)+'" target="_blank" rel="noopener">ابحث في يوتيوب عن شرح هذا الدرس</a></p>';
  html+='</div>';
  fb.innerHTML=html;
}
function submitAnswer(){
  const q=currentQuestion(),card=$("question-card");
  if(card.dataset.locked) return;
  const r=qRec(q.id);
  const spent=questionTimeSpent();
  let userInput="",correct=false,extraNote="";
  if(q.questionType==="teachback"){
    userInput=($("answer-input").value||"").trim();
    if(userInput.length<CONFIG.TEACHBACK_MIN_LEN){toast("الشرح قصير جدًا — اكتب جملة أو جملتين على الأقل بكلماتك.");return;}
    const tb=checkTeachBackKeywords(userInput,q.keywordsForTeachBack);
    r.teachText=userInput;r.teachOk=tb.autoOk;
    r.attempts++;r.timeSpent+=spent;r.answers.push(userInput);
    card.dataset.locked="1";
    let html='<div class="feedback '+(tb.autoOk?"good":"neutral")+'">';
    html+='<h3>'+(tb.autoOk?"✅ شرح جيد — وُجدت العناصر الأساسية":"📝 حُفظ شرحك — يحتاج مراجعة ولي الأمر/المعلم")+'</h3>';
    if(tb.found.length) html+='<p>عناصر وردت في شرحك: '+esc(tb.found.join("، "))+'</p>';
    if(tb.missing.length) html+='<p>عناصر لم تُذكر بوضوح: <b>'+esc(tb.missing.join("، "))+'</b></p>';
    html+='<p><b>الإجابة النموذجية:</b> '+esc(q.explanation)+'</p></div>';
    $("feedback-area").innerHTML=html;
    RUN.results.push({qid:q.id,correct:tb.autoOk,first:true,spent,teach:true});
    afterAnswerControls(q,tb.autoOk,true);
    saveProgress();
    return;
  }
  if(q.questionType==="steps"){
    const fields={given:$("st-given").value,law:$("st-law").value,
      substitution:$("st-sub").value,work:$("st-work").value,final:$("st-final").value};
    userInput=fields.final;
    if(!userInput.trim()){toast("اكتب الإجابة النهائية.");return;}
    const stepsCheck=checkRequiredSteps(fields);
    correct=checkAnswer(q,userInput);
    r.steps=fields;r.stepsOk=stepsCheck.ok;
    if(correct&&!stepsCheck.ok){
      extraNote="إجابة صحيحة لكن الفهم غير مؤكد — الخطوات الناقصة: "+stepsCheck.missing.join("، ")+". لا يُمنح الإتقان الكامل بدون خطوات مقبولة.";
    }
  }else if(q.options){
    const sel=card.querySelector(".opt.sel");
    if(!sel){toast("اختر إجابة أولًا.");return;}
    userInput=sel.dataset.val;
    correct=normalizeAnswer(userInput)===normalizeAnswer(q.correctAnswer);
    card.querySelectorAll(".opt").forEach(o=>{
      if(normalizeAnswer(o.dataset.val)===normalizeAnswer(q.correctAnswer)) o.classList.add("ok");
      else if(o===sel&&!correct) o.classList.add("bad");
    });
  }else{
    userInput=($("answer-input").value||"").trim();
    if(!userInput){toast("اكتب إجابتك أولًا.");return;}
    correct=checkAnswer(q,userInput);
  }
  // تسجيل المحاولة
  r.attempts++;r.timeSpent+=spent;r.answers.push(userInput);
  const isFirst=r.attempts===1;
  if(isFirst) r.firstTryCorrect=correct;
  if(!correct) r.wrongCount++;
  r.correct=correct;
  // مؤشر السرعة يعكس آخر محاولة صحيحة: إجابة لاحقة متأنية تزيل التحذير
  if(correct) r.fast=spent<q.estimatedTime*CONFIG.FAST_RATIO;
  if(RUN.mode==="delayed"||RUN.mode==="cumulative"||RUN.mode==="mid") r.delayedWrong=!correct;
  card.dataset.locked="1";
  RUN.results.push({qid:q.id,correct,first:isFirst,spent,steps:q.questionType==="steps"?r.stepsOk:null});
  showExplanation(q,correct,userInput,extraNote);
  afterAnswerControls(q,correct,false);
  saveProgress();
}
/* الثقة بعد الأسئلة المهمة + زر المتابعة */
function afterAnswerControls(q,correct,isTeach){
  const fb=$("feedback-area");
  const needConf=!isTeach&&(q.difficulty>=3||q.isCritical||RUN.mode==="test"||RUN.mode==="final");
  let html="";
  if(needConf){
    html+='<div class="card tight" id="conf-box"><b>ما مدى ثقتك في إجابتك؟</b><div class="conf-row">'
      +["واثق جدًا","واثق","غير متأكد","كنت أخمن"].map(c=>'<button type="button" class="opt" onclick="setConfidence(this,\''+c+'\')">'+c+'</button>').join("")
      +'</div></div>';
  }
  html+='<div class="btn-row"><button class="btn" id="next-btn" onclick="nextQuestion()" '+(needConf?"disabled":"")+'>'
    +(RUN.idx+1>=RUN.list.length?"إنهاء هذا الجزء":"السؤال التالي")+'</button></div>';
  fb.insertAdjacentHTML("beforeend",html);

function setConfidence(btn,val){
  const q=currentQuestion();
  qRec(q.id).confidence=val;
  document.querySelectorAll("#conf-box .opt").forEach(o=>o.classList.remove("sel"));
  btn.classList.add("sel");
  $("next-btn").disabled=false;
  if(val==="كنت أخمن"&&qRec(q.id).correct)
    toast("إجابة صحيحة مع تخمين — سيُعاد اختبار هذا المفهوم للتأكد من الفهم.");
  saveProgress();
}
function nextQuestion(){
  const q=currentQuestion(),r=qRec(q.id);
  // سؤال متابعة مشابه بعد الخطأ (في وضع الدرس والعلاج فقط)
  if(!r.correct&&q.followUpQuestionId&&["lesson","recovery","prereq"].indexOf(RUN.mode)>=0
     &&!RUN.injected[q.followUpQuestionId]&&RUN.list.indexOf(q.followUpQuestionId)<0){
    RUN.injected[q.followUpQuestionId]=true;
    RUN.list.splice(RUN.idx+1,0,q.followUpQuestionId);
    toast("سؤال متابعة مشابه للتأكد من تجاوز الخطأ.");
  }
  RUN.idx++;
  if(RUN.idx>=RUN.list.length){finishRun(false);return;}
  renderQuestion();
}
function runScore(){
  const scored=RUN.results.filter(x=>!x.teach);
  if(!scored.length) return 100;
  // أسئلة الخطوات: صحيحة بدون خطوات = نصف درجة فقط
  let pts=0;
  scored.forEach(x=>{
    if(x.correct&&x.first){pts+=(x.steps===false?0.5:1);}
  });
  return Math.round(100*pts/scored.length);
}
/* ============================================================================
   إنهاء الجزء الحالي وتوجيه المسار
   ============================================================================ */
function finishRun(expired){
  clearInterval(qTimerInterval);
  const mode=RUN.mode,chId=RUN.chapterId,score=runScore(),run=RUN;
  RUN=null;
  if(mode==="prereq"){
    const pc=state.perChapter[chId];
    pc.prereqDone=true;pc.prereqScore=score;
    pc.prereqWeak=run.results.filter(x=>!x.correct).map(x=>QUESTIONS_BY_ID[x.qid].questionText);
    saveProgress();
    if(score<100) toast("توجد متطلبات سابقة تحتاج تقوية — ستُسجَّل في التقرير وسيُتابع الفصل مع تنبيه خاص.");
    renderChapter(chId);
  }else if(mode==="delayed"){
    const pc=state.perChapter[chId];
    pc.delayedDone=true;pc.delayedScore=score;
    saveProgress();
    if(score<70) toast("نتيجة المراجعة المؤجلة منخفضة — أعيدت بعض المفاهيم القديمة إلى قائمة المراجعة.");
    renderChapter(chId);
  }else if(mode==="lesson"){
    const pc=state.perChapter[chId];
    if(run.conceptId) pc.conceptsDone[run.conceptId]=true;
    saveProgress();
    toast("اكتمل هذا الدرس. مستوى المفهوم الآن: "+computeMastery(run.conceptId));
    renderChapter(chId);
  }else if(mode==="test"){
    const pc=state.perChapter[chId];
    pc.testDone=true;
    if(pc.testFirstScore===null) pc.testFirstScore=score;
    pc.testScore=score;
    evaluateChapter(chId,expired);
  }else if(mode==="recovery"){
    const pc=state.perChapter[chId];
    pc.recoveryDone=true;
    saveProgress();
    toast("اكتملت جولة معالجة نقاط الضعف. يمكنك الآن إعادة اختبار الفصل.");
    renderChapter(chId);
  }else if(mode==="mid"){
    state.midTestDone=true;state.midTestScore=score;
    saveProgress();
    toast("اكتمل الاختبار الشامل لمنتصف المنهج. النتيجة: "+score+"%");
    renderDashboard();
  }else if(mode==="cumulative"){
    saveProgress();
    toast("اكتملت المراجعة التراكمية. النتيجة: "+score+"%");
    renderDashboard();
  }else if(mode==="final"){
    state.finalDone=true;state.finalScore=score;
    evaluateFinal(score);
  }else{
    renderDashboard();
  }
}
/* تقييم الفصل بعد اختبار الإتقان */
function evaluateChapter(chId,expired){
  const ch=CURRICULUM.chapters.find(c=>c.id===chId),pc=state.perChapter[chId];
  stopChapterTimer();
  const blockers=chapterBlockers(ch);
  pc.blockers=blockers;
  const score=pc.testScore;
  let status;
  if(expired&&score===null){status="failed";}
  if(blockers.length>0){status="verify";}
  else if(score>=ch.passPercent){status="passed";}
  else if(score>=CONFIG.REVIEW_PERCENT){status="review";}
  else{status="failed";}
  pc.status=status;
  if(status==="passed"){
    const idx=CURRICULUM.chapters.findIndex(c=>c.id===chId);
    if(idx+1<CURRICULUM.chapters.length){
      const nxt=CURRICULUM.chapters[idx+1].id;
      if(state.perChapter[nxt].status==="locked") state.perChapter[nxt].status="unlocked";
    }
  }
  saveProgress();
  generateChapterReport(chId,expired);
}

function chapterReportData(chId,partial){
  const ch=CURRICULUM.chapters.find(c=>c.id===chId),pc=state.perChapter[chId];
  const chQs=QUESTION_BANK.filter(q=>q.chapterId===chId);
  let answered=0,correct=0,wrong=0,multi=[],fast=[],noSteps=[],teach=[],unanswered=[];
  const mistakeCounts={};
  let times=[];
  chQs.forEach(q=>{
    const r=state.questions[q.id];
    if(!r||r.attempts===0){unanswered.push(q.id);return;}
    answered++;times.push(r.timeSpent);
    if(r.firstTryCorrect)correct++;else wrong++;
    if(r.attempts>1)multi.push(q.questionText);
    if(r.correct&&r.fast)fast.push(q.questionText);
    if(q.questionType==="steps"&&r.correct&&r.stepsOk===false)noSteps.push(q.questionText);
    if(q.questionType==="teachback"&&r.teachText)teach.push({q:q.questionText,a:r.teachText,ok:r.teachOk});
    if(r.wrongCount>0)mistakeCounts[q.mistakeType]=(mistakeCounts[q.mistakeType]||0)+r.wrongCount;
  });
  const masteryMap={};
  chapterConcepts(ch).forEach(cid=>{masteryMap[CONCEPTS[cid].title]=computeMastery(cid);});
  const strong=Object.keys(masteryMap).filter(k=>[MASTERY.VERY,MASTERY.OK].indexOf(masteryMap[k])>=0);
  const weak=Object.keys(masteryMap).filter(k=>[MASTERY.VERY,MASTERY.OK,MASTERY.NONE].indexOf(masteryMap[k])<0);
  const criticalFailed=chapterConcepts(ch).filter(cid=>CONCEPTS[cid].critical
    &&[MASTERY.VERY,MASTERY.OK].indexOf(computeMastery(cid))<0).map(cid=>CONCEPTS[cid].title);
  const topMistakes=Object.entries(mistakeCounts).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([k,v])=>k+" ("+v+" مرات)");
  const pct=answered?Math.round(100*correct/answered):0;
  const masteryLevel=pc.status==="passed"?(pct>=95?MASTERY.VERY:MASTERY.OK)
    :pc.status==="review"?MASTERY.REVIEW:pc.status==="verify"?MASTERY.VERIFY:MASTERY.WEAK;
  let recommendation;
  if(pc.status==="passed") recommendation="الفصل مُجتاز. يُنصح بمراجعة خفيفة لنقاط الضعف المذكورة ثم الانتقال للفصل التالي.";
  else if(pc.status==="review") recommendation="النتيجة بين 80% و90%: راجع المفاهيم الضعيفة عبر «مراجعة نقاط الضعف» ثم أعد اختبار الفصل قبل الانتقال.";
  else if(pc.status==="verify") recommendation="توجد موانع اجتياز (مفاهيم حرجة أو مؤشرات تخمين/سرعة): قد تحتاج إلى إعادة هذا الجزء للتأكد من الفهم، لأن بعض الإجابات كانت سريعة جدًا أو بدون خطوات كافية.";
  else recommendation="النتيجة أقل من 80%: يجب إعادة دروس الفصل من البداية مع التركيز على المفاهيم الحرجة قبل أي تقدم.";
  return {chapterId:chId,chapterTitle:"الفصل "+ch.num+": "+ch.title,partial:!!partial,
    date:new Date().toLocaleString("ar-SA"),
    lessonsDone:ch.lessons.filter(l=>l.concepts.every(c=>pc.conceptsDone[c])).map(l=>l.title),
    budgetMin:ch.minutes,usedMin:Math.round(pc.timeUsedSec/60),
    withinTime:pc.timeUsedSec<=ch.minutes*60,
    answered,correct,wrong,pct,score:pc.testScore,prereqScore:pc.prereqScore,prereqWeak:pc.prereqWeak,
    delayedScore:pc.delayedScore,masteryLevel,masteryMap,strong,weak,criticalFailed,topMistakes,
    multi,fast,noSteps,teach,unansweredCount:unanswered.length,
    avgQuestionTime:times.length?Math.round(times.reduce((a,b)=>a+b,0)/times.length):0,
    blockers:pc.blockers||[],status:CH_STATUS_LABEL[pc.status]||pc.status,
    statusKey:pc.status,recommendation,
    tabSwitches:state.events.tabSwitches,pastes:state.events.pastes};
}

function findReport(id){return state.reports.find(r=>r.id===id);}
function copyReport(id){

  else fallbackCopy(rep.text,done);

function fallbackCopy(text,done){
  const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);
  ta.select();try{document.execCommand("copy");done();}catch(e){toast("تعذر النسخ آليًا.");}
  document.body.removeChild(ta);
}
function downloadReport(id){

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);

  a.click();URL.revokeObjectURL(a.href);
}
/* ============================================================================
   محرك البريد: EmailJS تلقائي إذا هُيِّئ، وإلا mailto احتياطي
   ============================================================================ */
function emailConfigured(){
  return CONFIG.EMAILJS_PUBLIC_KEY&&CONFIG.EMAILJS_SERVICE_ID&&CONFIG.EMAILJS_TEMPLATE_ID
    &&CONFIG.EMAILJS_PUBLIC_KEY.indexOf("ضع_")!==0
    &&CONFIG.EMAILJS_SERVICE_ID.indexOf("ضع_")!==0
    &&CONFIG.EMAILJS_TEMPLATE_ID.indexOf("ضع_")!==0;
}
let emailjsLoading=null;
function loadEmailJs(){
  if(window.emailjs) return Promise.resolve();
  if(emailjsLoading) return emailjsLoading;
  emailjsLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
    s.onload=res;s.onerror=()=>rej(new Error("تعذر تحميل مكتبة EmailJS (لا يوجد اتصال؟)"));
    document.head.appendChild(s);
  });
  return emailjsLoading;
}
function setEmailStatus(rep,status){
  rep.emailStatus=status;saveProgress();
  const el=$("email-status");if(el)el.textContent=status;
}
function sendChapterReport(rep){
  const subject="تقرير إتمام فصل رياضيات - "+rep.data.chapterTitle;
  if(emailConfigured()){
    setEmailStatus(rep,"جارٍ الإرسال عبر EmailJS...");
    loadEmailJs().then(()=>{
      window.emailjs.init({publicKey:CONFIG.EMAILJS_PUBLIC_KEY});
      return window.emailjs.send(CONFIG.EMAILJS_SERVICE_ID,CONFIG.EMAILJS_TEMPLATE_ID,
        {to_email:CONFIG.REPORT_RECIPIENT,subject:subject,message:rep.text,student:state.studentName});
    }).then(()=>{setEmailStatus(rep,"أُرسل آليًا ✔");toast("أُرسل التقرير بالبريد آليًا.");})
      .catch(err=>{setEmailStatus(rep,"فشل الإرسال الآلي — استُخدم البريد الاحتياطي");
        console.warn(err);openMailtoReport(rep);});
  }else{
    setEmailStatus(rep,"EmailJS غير مُهيأ — وضع mailto الاحتياطي");
    openMailtoReport(rep);
  }
}
function openMailtoReport(rep){
  const subject="تقرير إتمام فصل رياضيات - "+rep.data.chapterTitle;
  let body=rep.text;
  // روابط mailto الطويلة جدًا قد تفشل؛ نقتطع ونحيل إلى النسخ/التحميل
  const url="mailto:"+CONFIG.REPORT_RECIPIENT+"?subject="+encodeURIComponent(subject)+"&body=";
  const maxBody=1800-url.length;
  if(encodeURIComponent(body).length>maxBody){
    body=body.split("ملاحظات مهمة:")[0]
      +"\n(التقرير الكامل أطول من حد رسالة mailto — استخدم زر «نسخ التقرير» أو «تحميل التقرير» وأرفقه بالرسالة.)";
    toast("التقرير طويل: فُتح ملخص في البريد، وانسخ التقرير الكامل من الشاشة.");
  }
  window.location.href=url+encodeURIComponent(body);
  if(rep.emailStatus.indexOf("أُرسل آليًا")<0) setEmailStatus(rep,"فُتح بريد mailto — بانتظار إرسال المستخدم");
}

/* ============================================================================
   الاختبار الشامل النهائي والتقرير النهائي
   ============================================================================ */
function renderFinalAssessment(){startFinalAssessment();}
function startFinalAssessment(){
  const allPassed=CURRICULUM.chapters.every(c=>state.perChapter[c.id].status==="passed");
  if(!allPassed){toast("الاختبار النهائي يُفتح بعد اجتياز جميع الفصول.");return;}
  // تركيبة الاختبار: أسئلة اختبار/تحدٍّ/مسائل من كل الفصول + أسئلة من المفاهيم الضعيفة + خطوات + شرح
  let ids=[];
  CURRICULUM.chapters.forEach(ch=>{
    ids=ids.concat(pickQuestions(q=>q.chapterId===ch.id&&(q.tags.indexOf("exam")>=0||q.tags.indexOf("challenge")>=0),4));
    ids=ids.concat(pickQuestions(q=>q.chapterId===ch.id&&q.tags.indexOf("delayed")>=0,2));
  });
  // مفاهيم ضعيفة: سؤال إضافي لكل منها
  Object.keys(CONCEPTS).forEach(cid=>{
    const m=computeMastery(cid);
    if([MASTERY.VERY,MASTERY.OK].indexOf(m)<0)
      ids=ids.concat(pickQuestions(q=>q.conceptId===cid&&q.tags.indexOf("test")>=0,1));
  });
  ids=ids.concat(pickQuestions(q=>q.questionType==="steps",2));
  ids=ids.concat(pickQuestions(q=>q.questionType==="teachback",2));
  ids=shuffle(Array.from(new Set(ids))).slice(0,26);
  startQuiz("final",ids,{title:"الاختبار الشامل النهائي",timeLimitSec:60*60});
}
function evaluateFinal(score){
  const criticalIds=Object.keys(CONCEPTS).filter(c=>CONCEPTS[c].critical);
  const criticalOk=criticalIds.every(c=>[MASTERY.VERY,MASTERY.OK,MASTERY.REVIEW].indexOf(computeMastery(c))>=0);
  const weakChapters=CURRICULUM.chapters.filter(c=>state.perChapter[c.id].status!=="passed");
  state.finalPassed=score>=85&&criticalOk&&weakChapters.length===0;
  saveProgress();
  renderFinalReport();
}
function readinessLevel(){
  const score=state.finalScore===null?0:state.finalScore;
  const criticalIds=Object.keys(CONCEPTS).filter(c=>CONCEPTS[c].critical);
  const criticalOk=criticalIds.every(c=>[MASTERY.VERY,MASTERY.OK].indexOf(computeMastery(c))>=0);
  const criticalAcceptable=criticalIds.every(c=>[MASTERY.VERY,MASTERY.OK,MASTERY.REVIEW,MASTERY.FIX,MASTERY.VERIFY].indexOf(computeMastery(c))>=0);
  if(!state.finalDone) return "لم يُنجز الاختبار النهائي بعد";
  if(score>=90&&criticalOk) return "جاهز جدًا";
  if(score>=85&&criticalAcceptable) return "جاهز";
  if(score>=80) return "جاهز مع مراجعة بسيطة";
  if(score>=65) return "يحتاج مراجعة إضافية";
  return "غير جاهز بعد";
}
function renderFinalReport(){
  const allConcepts=Object.keys(CONCEPTS);
  const mastered=allConcepts.filter(c=>[MASTERY.VERY,MASTERY.OK].indexOf(computeMastery(c))>=0);
  const weak=allConcepts.filter(c=>{const m=computeMastery(c);return m!==MASTERY.NONE&&[MASTERY.VERY,MASTERY.OK].indexOf(m)<0;});
  const lessonsDone=CURRICULUM.chapters.reduce((n,ch)=>n+ch.lessons.filter(l=>l.concepts.every(c=>state.perChapter[ch.id].conceptsDone[c])).length,0);
  const chaptersDone=CURRICULUM.chapters.filter(c=>state.perChapter[c.id].status==="passed").length;
  const avgTime=Math.round(CURRICULUM.chapters.reduce((n,c)=>n+state.perChapter[c.id].timeUsedSec,0)/60/CURRICULUM.chapters.length);
  // أكثر خطأ متكرر على مستوى المنهج
  const mc={};
  QUESTION_BANK.forEach(q=>{const r=state.questions[q.id];if(r&&r.wrongCount>0)mc[q.mistakeType]=(mc[q.mistakeType]||0)+r.wrongCount;});
  const top=Object.entries(mc).sort((a,b)=>b[1]-a[1]);
  // أقوى/أضعف فصل
  const byScore=CURRICULUM.chapters.map(ch=>{
    const qs=QUESTION_BANK.filter(q=>q.chapterId===ch.id);
    let a=0,c=0;qs.forEach(q=>{const r=state.questions[q.id];if(r&&r.attempts){a++;if(r.firstTryCorrect)c++;}});
    return {title:ch.title,pct:a?Math.round(100*c/a):0,answered:a};
  }).filter(x=>x.answered>0).sort((a,b)=>b.pct-a.pct);
  const row=(k,v)=>'<tr><th>'+k+'</th><td>'+v+'</td></tr>';
  const readiness=readinessLevel();
  $("screen-final").innerHTML=
    '<div class="hero"><h1>🏁 التقرير النهائي للمنهج</h1><p>'+esc(state.studentName)+' — '+new Date().toLocaleString("ar-SA")+'</p></div>'
    +'<div class="card"><table class="report">'
    +row("عدد الفصول المكتملة",'<span class="num">'+chaptersDone+' / '+CURRICULUM.chapters.length+'</span>')
    +row("عدد الدروس المكتملة",'<span class="num">'+lessonsDone+' / '+CURRICULUM.chapters.reduce((n,c)=>n+c.lessons.length,0)+'</span>')
    +row("عدد المفاهيم المتقنة",'<span class="num">'+mastered.length+' / '+allConcepts.length+'</span>')
    +row("عدد المفاهيم الضعيفة",'<span class="num">'+weak.length+'</span>'+(weak.length?'<br>'+weak.map(c=>esc(CONCEPTS[c].title)+' ('+computeMastery(c)+')').join("<br>"):""))
    +row("النتيجة النهائية",state.finalDone?'<span class="num">'+state.finalScore+'%</span>':"لم يُنجز بعد")
    +row("اختبار منتصف المنهج",state.midTestDone?'<span class="num">'+state.midTestScore+'%</span>':"لم يُنجز")
    +row("متوسط الوقت لكل فصل",'<span class="num">'+avgTime+'</span> دقيقة')
    +row("أكثر نوع خطأ متكرر",top.length?esc(top[0][0])+" ("+top[0][1]+" مرات)":"لا أخطاء مسجلة")
    +row("أقوى فصل",byScore.length?esc(byScore[0].title)+" ("+byScore[0].pct+"%)":"—")
    +row("أضعف فصل",byScore.length?esc(byScore[byScore.length-1].title)+" ("+byScore[byScore.length-1].pct+"%)":"—")
    +row("أكثر موضوع يحتاج مراجعة",weak.length?esc(CONCEPTS[weak[0]].title):"لا يوجد")
    +row("هل الطالب جاهز للاختبار؟",'<b><span class="badge '+(readiness.indexOf("جاهز")===0?"b-green":"b-warn")+'">'+readiness+'</span></b>')
    +'</table>'
    +'<div class="alert info">هذا التقييم يعبّر عن مستوى الجاهزية وفق هذا النظام فقط، ولا يضمن نتيجة الاختبار الفعلي.</div>'
    +'<div class="btn-row no-print"><button class="btn" onclick="window.print()">طباعة التقرير</button>'
    +'<button class="btn gray" onclick="renderDashboard()">لوحة الفصول</button></div></div>';
  show("screen-final");
}

/* ============================================================================
   لوحة ولي الأمر / المعلم (محمية برقم سري)
   ============================================================================ */
function renderParentDashboard(){
  $("screen-parent").innerHTML=
    '<div class="card pin-box"><h2>🔐 لوحة ولي الأمر / المعلم</h2>'
    +'<p>أدخل الرقم السري:</p><input type="password" id="pin-input" inputmode="numeric" autocomplete="off">'
    +'<div class="btn-row" style="justify-content:center"><button class="btn" onclick="checkPin()">دخول</button>'
    +'<button class="btn gray" onclick="renderDashboard()">رجوع</button></div></div>';
  show("screen-parent");
}
function checkPin(){
  if(($("pin-input").value||"")!==CONFIG.PARENT_PIN){toast("الرقم السري غير صحيح.");return;}
  renderParentContent();
}
function renderParentContent(){
  let html='<div class="hero"><h1>👨‍👦 لوحة ولي الأمر / المعلم</h1><p>الطالب: '+esc(state.studentName)+' — التقدم الكلي: '+overallProgress()+'%</p></div>';
  // مؤشرات النزاهة العامة
  const guessy=QUESTION_BANK.filter(q=>{const r=state.questions[q.id];return r&&r.correct&&r.confidence==="كنت أخمن";}).length;
  const lowConf=QUESTION_BANK.filter(q=>{const r=state.questions[q.id];return r&&r.correct&&r.confidence==="غير متأكد";}).length;
  const fastAll=QUESTION_BANK.filter(q=>{const r=state.questions[q.id];return r&&r.correct&&r.fast;}).length;
  html+='<div class="card"><h3>مؤشرات التحقق من الفهم (صياغة محايدة)</h3><ul class="clean">'
    +'<li>إجابات صحيحة لكن بسرعة عالية: <b class="num">'+fastAll+'</b></li>'
    +'<li>إجابات صحيحة مع ثقة منخفضة: <b class="num">'+lowConf+'</b></li>'
    +'<li>إجابات صحيحة وصرّح الطالب بأنه خمّن: <b class="num">'+guessy+'</b></li>'
    +'<li>مرات مغادرة التبويب: <b class="num">'+state.events.tabSwitches+'</b> — مرات لصق نص: <b class="num">'+state.events.pastes+'</b></li>'
    +'</ul><p class="muted">قد تحتاج بعض الأجزاء إلى إعادة للتأكد من الفهم، لأن بعض الإجابات كانت سريعة جدًا أو بدون خطوات كافية.</p></div>';
  CURRICULUM.chapters.forEach(ch=>{
    const pc=state.perChapter[ch.id];
    const concepts=chapterConcepts(ch);
    html+='<div class="card"><h2>الفصل '+ch.num+': '+esc(ch.title)+' '+chStatusBadge(pc.status)+'</h2>'
      +'<div class="kv"><span>نتيجة اختبار الفصل (أول مرة / آخر مرة)</span><b class="num">'+(pc.testFirstScore===null?"—":pc.testFirstScore+"%")+' / '+(pc.testScore===null?"—":pc.testScore+"%")+'</b></div>'
      +'<div class="kv"><span>الوقت المستخدم</span><b class="num">'+Math.round(pc.timeUsedSec/60)+' دقيقة من '+ch.minutes+'</b></div>'
      +'<div class="kv"><span>فحص المتطلبات / المراجعة المؤجلة</span><b class="num">'+(pc.prereqScore===null?"—":pc.prereqScore+"%")+' / '+(pc.delayedScore===null?"—":pc.delayedScore+"%")+'</b></div>'
      +'<div class="kv"><span>عدد التقارير المولدة</span><b class="num">'+pc.reportCount+'</b></div>'
      +(pc.blockers&&pc.blockers.length?'<div class="alert err"><b>موانع الاجتياز:</b><br>'+pc.blockers.map(esc).join("<br>")+'</div>':"")
      +'<h3>المفاهيم</h3>';
    concepts.forEach(cid=>{
      const m=computeMastery(cid);
      html+='<div class="kv"><span>'+esc(CONCEPTS[cid].title)+(CONCEPTS[cid].critical?' <span class="badge b-red">حرج</span>':"")+'</span>'
        +'<span class="badge '+masteryBadgeClass(m)+'">'+m+'</span></div>';
    });
    // إجابات الشرح والخطوات
    const teach=QUESTION_BANK.filter(q=>q.chapterId===ch.id&&q.questionType==="teachback")
      .map(q=>({q,r:state.questions[q.id]})).filter(x=>x.r&&x.r.teachText);
    const steps=QUESTION_BANK.filter(q=>q.chapterId===ch.id&&q.questionType==="steps")
      .map(q=>({q,r:state.questions[q.id]})).filter(x=>x.r&&x.r.steps);
    if(teach.length){
      html+='<h3>إجابات «اشرح بكلماتك»</h3>';
      teach.forEach(x=>{html+='<div class="card tight"><p><b>س:</b> '+esc(x.q.questionText)+'</p><p><b>ج:</b> '+esc(x.r.teachText)+'</p>'
        +'<span class="badge '+(x.r.teachOk?"b-green":"b-warn")+'">'+(x.r.teachOk?"مقبول آليًا":"يحتاج مراجعة ولي الأمر/المعلم")+'</span></div>';});
    }
    if(steps.length){
      html+='<h3>إجابات «أظهر خطواتك»</h3>';
      steps.forEach(x=>{html+='<div class="card tight"><p><b>س:</b> '+esc(x.q.questionText)+'</p>'
        +'<p><b>المعطيات:</b> '+esc(x.r.steps.given||"—")+'<br><b>القانون:</b> '+esc(x.r.steps.law||"—")
        +'<br><b>التعويض:</b> '+esc(x.r.steps.substitution||"—")+'<br><b>الخطوات:</b> '+esc(x.r.steps.work||"—")
        +'<br><b>الإجابة النهائية:</b> '+esc(x.r.steps.final||"—")+'</p>'
        +'<span class="badge '+(x.r.stepsOk?"b-green":"b-warn")+'">'+(x.r.stepsOk?"خطوات مقبولة":"خطوات ناقصة — إجابة صحيحة لكن الفهم غير مؤكد")+'</span></div>';});
    }
    html+='</div>';
  });
  // التقارير
  html+='<div class="card"><h2>سجل التقارير</h2>';
  if(state.reports.length){
    state.reports.forEach(r=>{html+='<div class="kv"><span>'+esc(r.data.chapterTitle)+' — '+new Date(r.dateISO).toLocaleString("ar-SA")+'</span>'
      +'<span class="badge b-blue">'+esc(r.emailStatus)+'</span></div>';});
  }else html+='<p class="muted">لا تقارير بعد.</p>';
  html+='</div>'
    +'<div class="card"><h3>الجاهزية النهائية</h3><p><span class="badge b-purple">'+readinessLevel()+'</span></p></div>'
    +'<div class="btn-row no-print"><button class="btn" onclick="window.print()">طباعة</button>'
    +'<button class="btn gray" onclick="renderDashboard()">رجوع للوحة الفصول</button></div>';
  $("screen-parent").innerHTML=html;
  window.scrollTo(0,0);
}

/* ============================================================================
   تصدير/استيراد/إعادة ضبط التقدم
   ============================================================================ */
function exportProgress(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="math_mastery_progress_"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(a.href);
  toast("صُدِّر التقدم إلى ملف JSON.");
}
function importProgress(ev){
  const f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed.perChapter||!parsed.questions) throw new Error("بنية الملف غير صحيحة");
      state=Object.assign(defaultState(),parsed);
      saveProgress();toast("استُورد التقدم بنجاح.");
      renderDashboard();
    }catch(e){toast("فشل الاستيراد: "+e.message);}
  };
  reader.readAsText(f);
  ev.target.value="";
}
function resetProgress(){
  if(!confirm("هل أنت متأكد من إعادة ضبط جميع التقدم؟ سيُحذف كل شيء (الإجابات، التقارير، الإتقان). يُنصح بتصدير التقدم أولًا.")) return;
  if(!confirm("تأكيد أخير: لا يمكن التراجع بعد الحذف. هل تريد المتابعة؟")) return;
  localStorage.removeItem(CONFIG.STORAGE_KEY);
  state=defaultState();
  saveProgress();
  toast("أُعيد ضبط التقدم.");
  renderWelcome();
}

/* ============================================================================
   مراقبة النزاهة + الإقلاع
   ============================================================================ */
function initApp(){
  loadProgress();
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden&&RUN){state.events.tabSwitches++;saveProgress();}
  });
  window.addEventListener("beforeunload",saveProgress);
  renderWelcome();
}
if(typeof document!=="undefined"&&typeof window!=="undefined"&&window.document===document){
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",initApp);
  else initApp();
}
</script>
